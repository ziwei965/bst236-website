<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Station Temperature Explorer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; background: #1a1a2e; }

    #sidebar {
      width: 300px; min-width: 300px; background: #16213e; color: #e0e0e0;
      display: flex; flex-direction: column; border-right: 2px solid #0f3460;
    }
    #sidebar h1 { font-size: 1rem; padding: 14px 12px 8px; color: #e94560; font-weight: 700; line-height: 1.3; }
    #sidebar .subtitle { font-size: 0.72rem; padding: 0 12px 10px; color: #888; }
    #search-box {
      margin: 0 10px 8px; padding: 7px 10px; border-radius: 6px; border: 1px solid #0f3460;
      background: #0f3460; color: #e0e0e0; font-size: 0.82rem; outline: none;
    }
    #search-box::placeholder { color: #888; }
    #station-list { flex: 1; overflow-y: auto; }
    .station-item {
      padding: 7px 14px; cursor: pointer; font-size: 0.8rem; border-bottom: 1px solid #0f3460;
      display: flex; justify-content: space-between; align-items: center;
    }
    .station-item:hover { background: #0f3460; }
    .station-item.active { background: #e94560; color: #fff; }
    .station-item .temp-badge {
      font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; font-weight: 600;
    }
    .legend {
      padding: 10px 12px; border-top: 2px solid #0f3460; font-size: 0.72rem; color: #aaa;
    }
    .legend-bar {
      height: 10px; border-radius: 5px; margin: 6px 0 4px;
      background: linear-gradient(to right, #0077ff, #00ccff, #ffe600, #ff8800, #ff0000);
    }
    .legend-labels { display: flex; justify-content: space-between; }

    #map { flex: 1; }

    .custom-popup .leaflet-popup-content-wrapper {
      background: #16213e; color: #e0e0e0; border: 1px solid #e94560;
      border-radius: 8px; font-size: 0.85rem;
    }
    .custom-popup .leaflet-popup-tip { background: #e94560; }
    .popup-title { font-weight: 700; font-size: 1rem; color: #e94560; margin-bottom: 8px; }
    .popup-row { display: flex; justify-content: space-between; gap: 16px; margin-top: 4px; }
    .popup-stat { text-align: center; }
    .popup-stat .label { font-size: 0.7rem; color: #aaa; text-transform: uppercase; }
    .popup-stat .value { font-size: 0.95rem; font-weight: 600; }
    .val-min { color: #00ccff; }
    .val-mean { color: #ffe600; }
    .val-max { color: #ff4444; }
  </style>
</head>
<body>

<div id="sidebar">
  <h1>Global Station Temperature Explorer</h1>

</div>

// Deduplicate (Ségou appears twice in the data)
const seen = new Set();
const stationData = STATIONS.filter(s => {
  if (seen.has(s[0])) return false;
  seen.add(s[0]); return true;
});

// Color scale: mean temp → hue (blue → red)
function tempToColor(mean) {
  const cold = -15, hot = 30;
  const t = Math.max(0, Math.min(1, (mean - cold) / (hot - cold)));
  // 5-stop gradient matching the legend
  const stops = [
    [0,    [0,   119, 255]],
    [0.25, [0,   204, 255]],
    [0.5,  [255, 230,   0]],
    [0.75, [255, 136,   0]],
    [1.0,  [255,   0,   0]]
  ];
  let lo = stops[0], hi = stops[stops.length-1];
  for (let i = 0; i < stops.length - 1; i++) {
    if (t >= stops[i][0] && t <= stops[i+1][0]) { lo = stops[i]; hi = stops[i+1]; break; }
  }
  const f = (t - lo[0]) / (hi[0] - lo[0]);
  const r = Math.round(lo[1][0] + f * (hi[1][0] - lo[1][0]));
  const g = Math.round(lo[1][1] + f * (hi[1][1] - lo[1][1]));
  const b = Math.round(lo[1][2] + f * (hi[1][2] - lo[1][2]));
  return `rgb(${r},${g},${b})`;
}

// Init map
const map = L.map('map', { center: [20, 10], zoom: 2, minZoom: 2 });
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19
}).addTo(map);

// Build markers + sidebar list
const listEl = document.getElementById('station-list');
const markers = [];

stationData.forEach((s, i) => {
  const [name, lat, lng, min, mean, max] = s;
  const color = tempToColor(mean);
  const radius = 6 + Math.abs(mean) * 0.12;

  const circle = L.circleMarker([lat, lng], {
    radius, color: '#fff', weight: 0.5, fillColor: color, fillOpacity: 0.85
  }).addTo(map);

  const popupHtml = `
    <div class="popup-title">${name}</div>
    <div class="popup-row">
      <div class="popup-stat"><div class="label">Min</div><div class="value val-min">${min}&deg;C</div></div>
      <div class="popup-stat"><div class="label">Mean</div><div class="value val-mean">${mean}&deg;C</div></div>
      <div class="popup-stat"><div class="label">Max</div><div class="value val-max">${max}&deg;C</div></div>
    </div>`;
  circle.bindPopup(popupHtml, { className: 'custom-popup' });

  // Sidebar item
  const item = document.createElement('div');
  item.className = 'station-item';
  item.dataset.name = name.toLowerCase();
  item.innerHTML = `<span>${name}</span><span class="temp-badge" style="background:${color};color:${mean > 12 ? '#000' : '#fff'}">${mean}&deg;C</span>`;
  item.addEventListener('click', () => {
    map.setView([lat, lng], 5, { animate: true });
    circle.openPopup();
    document.querySelectorAll('.station-item').forEach(el => el.classList.remove('active'));
    item.classList.add('active');
  });
  listEl.appendChild(item);
  markers.push({ circle, item, name: name.toLowerCase() });
});

// Search
document.getElementById('search-box').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  markers.forEach(({ item }) => {
    item.style.display = item.dataset.name.includes(q) ? '' : 'none';
  });
});
